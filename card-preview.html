<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三张表情卡 · 本地预览</title>
<link rel="stylesheet" href="reactions.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#272822;font-family:system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:48px 24px}small{letter-spacing:2px;color:#727568}h1{font-size:36px;margin:14px 0}p{color:#717369;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:32px 0}.sample{border:1px solid #d8dbcd;border-radius:24px;padding:24px;background:#edeedc}.sample:nth-child(2){background:#efe4da}.sample:nth-child(3){background:#e4e1ed}.sample img{display:block;width:180px;height:180px;margin:auto}button,a{font:inherit;color:inherit;border:1px solid #a2a68f;border-radius:30px;padding:10px 18px;cursor:pointer;background:transparent;text-decoration:none}button:hover{background:#fff8}.scene{height:290px;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-radius:24px;overflow:hidden;background:#ddd}.person{padding:24px;background:linear-gradient(145deg,#c8d1c3,#83978b);color:#fff}.person+ .person{background:linear-gradient(145deg,#dcc6b8,#ad9289)}.hint{position:absolute;top:28px;left:0;right:0;text-align:center;color:#fff9;font-size:13px}.scene .card-reaction{bottom:14px}h2{font-size:19px}@media(max-width:640px){.cards{grid-template-columns:1fr}h1{font-size:28px}}
#reaction{position:absolute;inset:0;pointer-events:none}.hint{top:60px}
</style>
<main>
<small>LOCAL PREVIEW / 01</small>
<h1>话不用说，表情到位。</h1>
<p>三张卡牌的透明短动图。点击释放，查看下方会议区域中的效果。每次 1.8 秒，画面保持稳定。</p>
<div class="cards">
<article class="sample"><img src="assets/reactions/hehe.gif" alt="侧目冷笑"><h2>呵呵</h2><p>半眯眼，侧目，嘴角轻轻上扬。</p><button data-effect="hehe">释放表情</button></article>
<article class="sample"><img src="assets/reactions/question.gif" alt="挑眉疑惑"><h2>问号雨</h2><p>一边挑眉，一边露出怀疑的眼神。</p><button data-effect="question">释放表情</button></article>
<article class="sample"><img src="assets/reactions/applause.gif" alt="敷衍鼓掌"><h2>掌声送给你</h2><p>眼神平淡，慢慢给你鼓两下掌。</p><button data-effect="applause">释放表情</button></article>
</div>
<div class="scene"><div class="person">你</div><div class="person">伴侣</div><span class="hint">布局示意 · 不开启摄像头</span><div id="reaction"></div></div>
<p>这里只展示卡牌效果，音量特效和其他功能暂未改动。</p><a href="./">进入本地 Demo</a>
</main>
<script>
let timer;
document.querySelectorAll('[data-effect]').forEach(button => button.onclick = () => {
  clearTimeout(timer);
  const img = new Image();
  img.className = 'card-reaction'; img.alt = '';
  img.src = `assets/reactions/${button.dataset.effect}.gif?play=${Date.now()}`;
  document.querySelector('#reaction').replaceChildren(img);
  timer = setTimeout(() => img.remove(), 1800);
});
</script>
</html>
